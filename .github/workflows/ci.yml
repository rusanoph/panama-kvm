name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-infrastructure:
    name: Release infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12

      - name: Validate release notes generation
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: >-
            --unreleased
            --tag v999.0.0
            --with-commit "feat(ci): validate release notes"
            --with-commit "Unconventional release change"
            --verbose
        env:
          OUTPUT: release-notes-ci.md

      - name: Verify generated release notes
        shell: bash
        run: |
          set -euo pipefail

          test -s release-notes-ci.md
          grep -Fxq '### Features' release-notes-ci.md
          grep -Fxq -- '- **ci:** Validate release notes' release-notes-ci.md
          grep -Fxq '### Other Changes' release-notes-ci.md
          grep -Fxq -- '- Unconventional release change' release-notes-ci.md
          grep -Eq '/compare/v[0-9]+\.[0-9]+\.[0-9]+\.\.\.v999\.0\.0' release-notes-ci.md

  build:
    name: Build / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            gradle: ./gradlew
          - name: Windows
            os: windows-latest
            gradle: .\gradlew.bat

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true
          add-job-summary: on-failure

      - name: Build, test, and Javadoc
        run: ${{ matrix.gradle }} --no-daemon --stacktrace build javadoc

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.name }}-${{ github.sha }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: panama-kvm-${{ github.sha }}
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
