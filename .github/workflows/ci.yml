name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            gradle: ./gradlew
          - name: Windows
            os: windows-latest
            gradle: .\gradlew.bat

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true
          add-job-summary: on-failure

      - name: Build, test, and Javadoc
        run: ${{ matrix.gradle }} --no-daemon --stacktrace build javadoc

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.name }}-${{ github.sha }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: panama-kvm-${{ github.sha }}
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
